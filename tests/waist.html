<!doctype html><html lang="en"><meta charset="utf-8"><title>Waist close-up regression</title>
<style>body{background:#f6f4ed;color:#263730;font:14px system-ui;margin:16px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}select,button{padding:8px}#grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:8px}figure{margin:0}img{width:100%;display:block}figcaption{padding:6px}canvas{position:fixed;left:-2000px;width:280px;height:360px}pre{white-space:pre-wrap}</style>
<h1>Waist close-up regression</h1><p>Actual GLB, material surfaces, morphs and skeletal pose. Close camera; no hidden body faces or depth offsets.</p>
<nav><label>Asset <select id="asset"><option value="current">Current local</option><option value="deployed">Last deployed</option><option value="previous">Before last fix</option></select></label><label>Pose <select id="pose"><option>relaxed</option><option>tpose</option><option>wave</option><option>stride</option></select></label><label>Shoulders <select id="shoulders"><option value="0.5">50%</option><option value="0">0%</option><option value="1">100%</option></select></label><label>View <select id="view"><option value="both">Front and back</option><option value="oblique">Side angles</option></select></label><label><input id="diagnostic" type="checkbox">Magenta skin diagnostic</label><button id="run">Render close-ups</button></nav><pre id="status">Ready</pre><div id="grid"></div><canvas id="working"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';import {createHumanSoftwareRenderer} from '../src/human-software-renderer.js';import {applyPoseCorrectives} from '../src/pose-morphs.js';
const $=s=>document.querySelector(s),canvas=$('canvas'),params=new URL(location).searchParams;let renderer,mode='webgl';try{const context=canvas.getContext('webgl2',{antialias:true,alpha:true,preserveDrawingBuffer:true});if(!context)throw Error('No WebGL2');renderer=new THREE.WebGLRenderer({canvas,context,antialias:true,preserveDrawingBuffer:true});}catch{renderer=createHumanSoftwareRenderer(canvas);mode='software';}renderer.setPixelRatio(1);renderer.setSize(280,360,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),orbit=new THREE.Group();scene.add(orbit);scene.add(new THREE.HemisphereLight(0xf7f4ea,0x6a7263,2.3));const key=new THREE.DirectionalLight(0xfff2e4,3.1);key.position.set(-2.8,4.8,4.2);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.1,far:12});key.shadow.bias=-.0002;key.shadow.normalBias=.015;scene.add(key);const fill=new THREE.DirectionalLight(0xd9e8f0,1.2);fill.position.set(3,2,-2);scene.add(fill);const camera=new THREE.PerspectiveCamera(29,280/360,.01,40);camera.position.set(0,1.02,1);camera.lookAt(0,1.02,0);camera.updateProjectionMatrix();
let gltf,meshes=[],rest=[],mixer,manifest;$('#run').onclick=async()=>{const button=$('#run');button.disabled=true;$('#status').textContent='Rendering…';$('#grid').replaceChildren();try{if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Loopback only');manifest=await(await fetch('../assets/human/manifest.json')).json();const asset=$('#asset').value;gltf=await new GLTFLoader().loadAsync(asset==='current'?'../assets/human/foundation.glb':`../artifacts/waist/${asset}.glb`);orbit.clear();orbit.add(gltf.scene);meshes=[];rest=[];gltf.scene.traverse(o=>{if(o.isBone)rest.push([o,o.position.clone(),o.quaternion.clone(),o.scale.clone()]);if(o.isMesh){meshes.push(o);o.castShadow=o.receiveShadow=true;o.frustumCulled=false;for(const m of Array.isArray(o.material)?o.material:[o.material]){if(m.name==='Outfit')m.color.set('#d97842');if(m.name==='Pants')m.color.set('#3b5550');if(m.name==='Skin'&&$('#diagnostic').checked){m.map=null;m.color.set('#ff00ff');}}}});mixer=new THREE.AnimationMixer(gltf.scene);const pose=$('#pose').value;const clip=gltf.animations.find(c=>c.name===pose);if(clip){mixer.clipAction(clip).reset().play();mixer.setTime(0);}const shoulders=Number($('#shoulders').value);for(const yaw of $('#view').value==='oblique'?[Math.PI*.5,Math.PI*.75]:[0,Math.PI])for(const build of [0,.25,.5,.75,1]){for(const mesh of meshes){if(mesh.morphTargetInfluences){mesh.morphTargetInfluences.fill(0);for(const [control,value] of [['build',build],['shoulders',shoulders]]){const names=manifest.morphs[control],index=mesh.morphTargetDictionary[names[value<.5?0:1]];if(index!==undefined)mesh.morphTargetInfluences[index]=Math.abs(value-.5)*2;}applyPoseCorrectives(mesh,manifest.poseCorrectives,pose);}}orbit.rotation.y=yaw;scene.updateMatrixWorld(true);meshes.forEach(m=>m.skeleton?.update());renderer.render(scene,camera);const f=document.createElement('figure'),i=new Image(),c=document.createElement('figcaption');c.textContent=`${asset} · ${pose} · Build ${build*100}% · ${yaw===0?'front':yaw===Math.PI?'back':Math.round(yaw/Math.PI*180)+'°'}`;i.src=canvas.toDataURL();i.alt=c.textContent;f.append(c,i);$('#grid').append(f);await new Promise(requestAnimationFrame);}$('#status').textContent=`Complete: ${mode}. Ten waist close-ups, ${pose}, shoulders ${shoulders*100}%.`;}catch(e){$('#status').textContent=e.stack;}finally{button.disabled=false;}};
</script></html>
