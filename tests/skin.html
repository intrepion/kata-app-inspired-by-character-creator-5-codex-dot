<!doctype html><html lang="en"><meta charset="utf-8"><title>Regional skin acceptance</title><style>body{font:15px system-ui;background:#e8e8e4;color:#263b35;margin:20px}button{padding:12px}pre{white-space:pre-wrap}#source{position:fixed;left:-2000px;top:0;width:560px;height:700px}#views{display:grid;grid-template-columns:repeat(6,280px);gap:0}figure{margin:0}canvas{display:block;width:280px;height:350px}figcaption{padding:8px;font-size:13px}</style><h1>Matched skin material comparison</h1><p>Same face, camera, exposure and light per pair. Original material / regional skin. No geometry or texture-loading differences between angles. This is a procedural refinement, not a new scan.</p><button id="run">Run comparison</button> <button id="export" disabled>Export skin checks</button><pre id="results">Ready</pre><canvas id="source"></canvas><div id="views"></div><script type="module">
import {defaults} from '../src/project.js';import {createHumanRenderer} from '../src/human-renderer.js';
const params=new URLSearchParams(location.search),software=params.has('software'),source=document.querySelector('#source'),out=document.querySelector('#results'),views=document.querySelector('#views');let r,busy=false;
const report={passed:false,checks:[],views:[],exports:[],errors:[]};const originalError=console.error;console.error=(...args)=>{report.errors.push(args.map(String).join(' '));originalError(...args)};
function check(ok,label){report.checks.push({passed:!!ok,label});out.textContent=report.checks.map(c=>(c.passed?'PASS ':'FAIL ')+c.label).join('\n');if(!ok)throw Error(label)}
async function capture(name,body,kind='capture'){const res=await fetch('/__qa/'+kind+'/'+name,{method:'POST',body});if(!res.ok)throw Error('Capture '+res.status);return res.json()}
async function run(){if(busy)return;busy=true;document.querySelector('#run').disabled=true;try{r?.dispose();views.replaceChildren();report.checks=[];report.views=[];report.errors=[];if(software){const get=source.getContext.bind(source);source.getContext=(type,...args)=>type==='webgl2'?null:get(type,...args)}r=await createHumanRenderer(source);check(r.info.mode===(software?'software':'webgl'),r.info.mode+' / '+r.info.gpu);for(const light of ['studio','side','rim'])for(const [angle,yaw]of [['Front',0],['Three-quarter',.65],['Profile',Math.PI/2]])for(const mode of ['baseline','regional']){r.setSkinPreview(mode);r.setLighting(light);r.update({...defaults,hair:'none'});r.render(yaw,'face');await new Promise(requestAnimationFrame);r.render(yaw,'face');const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=source.width;canvas.height=source.height;canvas.getContext('2d').drawImage(source,0,0);caption.textContent=light+' · '+angle+' · '+mode;figure.append(canvas,caption);views.append(figure);report.views.push({light,angle,yaw,mode,project:{...defaults,hair:'none'}});}check(report.errors.length===0,'No WebGL shader / console errors');check(r.info.boneCount===53,'Original 53-bone rig');report.renderer={...r.info};report.passed=true;const mosaic=document.createElement('canvas');mosaic.width=1680;mosaic.height=1200;const c=mosaic.getContext('2d');c.fillStyle='#e8e8e4';c.fillRect(0,0,mosaic.width,mosaic.height);c.fillStyle='#263b35';c.font='20px system-ui';c.fillText('Original / regional skin · matched camera + light · '+r.info.mode+' · '+r.info.gpu,12,29);document.querySelectorAll('#views canvas').forEach((tile,i)=>{const x=i%6*280,y=Math.floor(i/6)*385+40;c.drawImage(tile,x,y,280,350);c.font='13px system-ui';c.fillText(report.views[i].light+' · '+report.views[i].angle+' · '+report.views[i].mode,x+7,y+370)});if(params.has('capture')){if(!software){const close=document.createElement('canvas');close.width=1120;close.height=1510;const cc=close.getContext('2d');cc.fillStyle='#e8e8e4';cc.fillRect(0,0,1120,1510);cc.fillStyle='#263b35';cc.font='22px system-ui';cc.fillText('Original / regional skin · same face, camera and light',15,32);const all=document.querySelectorAll('#views canvas');[0,1,8,9].forEach((index,i)=>{const x=i%2*560,y=Math.floor(i/2)*730+45;cc.drawImage(all[index],x,y,560,700);cc.font='16px system-ui';cc.fillText(report.views[index].light+' · '+report.views[index].angle+' · '+report.views[index].mode,x+12,y+721)});await capture('skin-closeup.png',await new Promise(resolve=>close.toBlob(resolve)));}report.capture=await capture(software?'skin-software.png':'skin-comparison.png',await new Promise(resolve=>mosaic.toBlob(resolve)));await capture(software?'skin-software-report.json':'skin-report.json',new Blob([JSON.stringify(report,null,2)]));}document.querySelector('#export').disabled=false;out.textContent+='\nREADY FOR VISUAL REVIEW';if(params.has('exports'))await exports();}catch(e){report.passed=false;out.textContent+='\nFAIL '+e.stack}finally{busy=false;document.querySelector('#run').disabled=false}}
async function exports(){try{for(const[name,mode,delta]of [['skin-baseline','baseline',{}],['skin-neutral','regional',{}],['skin-expression','regional',{smile:.75,browRaise:.5,blinkLeft:.7,gazeHorizontal:.5,gazeVertical:.4,lowerGarment:'skirt',pose:'stride'}]]){r.setSkinPreview(mode);const p={...defaults,...delta};r.update(p);r.render(.65,'face');const data=await r.exportGLB(name);const g=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true))));const m=g.materials.find(x=>x.name==='Skin');check(!!m.normalTexture&&!!m.pbrMetallicRoughness.metallicRoughnessTexture,'Portable skin PBR textures / '+name);check(g.animations.length===4,'Four pose clips / '+name);check(!JSON.stringify(g.extensionsUsed||[]).match(/transmission|volume/),'No false volume/transmission export / '+name);report.exports.push({project:p,mode,capture:await capture(name+'.glb',data,'export')});}report.exportPassed=true;await capture('skin-export-report.json',new Blob([JSON.stringify(report,null,2)]));out.textContent+='\nEXPORTS COMPLETE';}catch(e){out.textContent+='\nFAIL '+e.stack}}
document.querySelector('#run').onclick=run;document.querySelector('#export').onclick=exports;if(params.has('auto'))run();
</script></html>
