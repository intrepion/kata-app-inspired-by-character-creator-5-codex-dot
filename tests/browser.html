const frame=document.getElementById('app');await new Promise(r=>frame.onload=r);const w=frame.contentWindow,d=w.document;let rows=[];const tick=()=>new Promise(r=>setTimeout(r,1500));function check(name,value){rows.push((value?'PASS':'FAIL')+' '+name);if(!value)throw Error(name);}const click=id=>d.getElementById(id).click(),change=(id,value)=>{const e=d.getElementById(id);e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};try{await tick();check('Original 3D mesh renders',d.getElementById('stage').width>500&&d.getElementById('mesh-count').textContent.includes('FACES'));const before=d.getElementById('stage').toDataURL();change('head','1.3');await tick();check('Proportion slider changes rendered mesh',d.getElementById('stage').toDataURL()!==before);click('undo');await tick();check('Undo restores morph',d.getElementById('head').value==='1');click('redo');await tick();check('Redo restores edit',d.getElementById('head').value==='1.3');d.querySelector('[data-pose="wave"]').click();check('Pose updates selected state',d.querySelector('[data-pose="wave"]').getAttribute('aria-pressed')==='true');click('side');await tick();check('Orbit control changes image',d.getElementById('stage').toDataURL()!==before);let blob;w.URL.createObjectURL=b=>(blob=b,'blob:test');w.HTMLAnchorElement.prototype.click=function(){};click('save');check('Editable project download has schema',JSON.parse(await blob.text()).version===1);click('export');check('OBJ export includes geometry',(await blob.text()).includes('\nf 1 2 3'));click('snapshot');await tick();check('PNG preview export produces image',blob.type==='image/png'&&blob.size>100);change('name','QA Character');check('Safe DOM name rendering',d.getElementById('character-title').textContent==='QA Character');check('Autosave contains current edit',JSON.parse(w.localStorage.getItem('kata-persona-v1-qa')).name==='QA Character');const saved=JSON.parse(w.localStorage.getItem('kata-persona-v1-qa'));saved.name='Imported QA';const dt=new DataTransfer();dt.items.add(new File([JSON.stringify(saved)],'test.persona',{type:'application/json'}));w.confirm=()=>false;d.getElementById('file').files=(()=>{const transfer=new DataTransfer();transfer.items.add(new File([JSON.stringify(saved)],'test.persona',{type:'application/json'}));return transfer.files;})();d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Cancel import preserves current character',d.getElementById('name').value==='QA Character');w.confirm=()=>true;d.getElementById('file').files=(()=>{const transfer=new DataTransfer();transfer.items.add(new File([JSON.stringify(saved)],'test.persona',{type:'application/json'}));return transfer.files;})();d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Project import restores fields',d.getElementById('name').value==='Imported QA');const bad=new DataTransfer();bad.items.add(new File(['{"version":99}'],'bad.persona'));d.getElementById('file').files=bad.files;d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Malformed import reported without losing work',d.getElementById('status').textContent.includes('Could not open')&&d.getElementById('name').value==='Imported QA');click('save');click('undo');await tick();let prompted=false;w.confirm=()=>{prompted=true;return false;};const afterUndo=d.getElementById('name').value;d.getElementById('file').files=(()=>{const transfer=new DataTransfer();transfer.items.add(new File([JSON.stringify(saved)],'test.persona',{type:'application/json'}));return transfer.files;})();d.getElementById('file').dispatchEvent(new Event('change'));await tick();check('Undo after saving still warns before replacement',prompted&&d.getElementById('name').value===afterUndo);d.querySelector('[data-preset="explorer"]').click();click('reset-view');const expectedName=d.getElementById('name').value;await new Promise(r=>{frame.onload=r;frame.src='../?qa=1&reload=1';});await tick();check('Autosave restores after reload',frame.contentDocument.getElementById('name').value===expectedName);frame.contentWindow.localStorage.removeItem('kata-persona-v1-qa');rows.push('All '+rows.length+' checks passed.');}catch(e){rows.push('ERROR '+e.message);}document.getElementById('result').textContent=rows.join('\n');document.title=rows.some(x=>x.startsWith('FAIL')||x.startsWith('ERROR'))?'FAIL':'PASS';
</script></body></html>
