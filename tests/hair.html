<!doctype html><html lang="en"><meta charset="utf-8"><title>Static crop acceptance</title><style>body{font:15px system-ui;background:#e8e8e4;color:#263b35;margin:20px}button{padding:12px}pre{white-space:pre-wrap}#source{position:fixed;left:-2000px;top:0;width:560px;height:700px}#views{display:grid;grid-template-columns:repeat(6,280px);gap:0}figure{margin:0}canvas{display:block;width:280px;height:350px}figcaption{padding:8px;font-size:13px}</style><h1>Matched short crop comparison</h1><p>Original / clumped crop. Same face, light and camera per pair. Static original geometry and maps. No simulated groom.</p><button id="run">Run comparison</button> <button id="export" disabled>Export hair checks</button><pre id="results">Ready</pre><canvas id="source"></canvas><div id="views"></div><script type="module">
import {defaults} from '../src/project.js';import {createHumanRenderer} from '../src/human-renderer.js';
const params=new URLSearchParams(location.search),software=params.has('software'),source=document.querySelector('#source'),out=document.querySelector('#results'),views=document.querySelector('#views');let r,busy=false;
const report={passed:false,checks:[],views:[],exports:[],errors:[]};const originalError=console.error;console.error=(...args)=>{report.errors.push(args.map(String).join(' '));originalError(...args)};
function check(ok,label){report.checks.push({passed:!!ok,label});out.textContent=report.checks.map(c=>(c.passed?'PASS ':'FAIL ')+c.label).join('\n');if(!ok)throw Error(label)}
async function capture(name,body,kind='capture'){const res=await fetch('/__qa/'+kind+'/'+name,{method:'POST',body});if(!res.ok)throw Error('Capture '+res.status);return res.json()}
async function view(label,p,yaw,mode,light='studio'){r.setHairPreview(mode);r.setLighting(light);r.update(p);r.render(yaw,'face');await new Promise(requestAnimationFrame);r.render(yaw,'face');const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=source.width;canvas.height=source.height;canvas.getContext('2d').drawImage(source,0,0);caption.textContent=label+' · '+mode;figure.append(canvas,caption);views.append(figure);report.views.push({label,project:p,yaw,mode,light});}
function mosaic(start,count,columns=6,scale=.5){const tileW=560*scale,tileH=700*scale,c=document.createElement('canvas');c.width=columns*tileW;c.height=Math.ceil(count/columns)*(tileH+32)+40;const ctx=c.getContext('2d');ctx.fillStyle='#e8e8e4';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#263b35';ctx.font='18px system-ui';ctx.fillText('Original / clumped crop · '+r.info.mode+' · '+r.info.gpu,10,26);const all=document.querySelectorAll('#views canvas');for(let k=0;k<count;k++){const x=k%columns*tileW,y=Math.floor(k/columns)*(tileH+32)+40;ctx.drawImage(all[start+k],x,y,tileW,tileH);ctx.font='13px system-ui';ctx.fillText(report.views[start+k].label+' · '+report.views[start+k].mode,x+7,y+tileH+21)}return c;}
async function timing(mode){r.setHairPreview(mode);r.update(defaults);const gl=source.getContext('webgl2'),gpu=[];for(let i=0;i<5;i++){r.render(i*.015,'face');gl.finish();}for(let i=0;i<24;i++){const start=performance.now();r.render(i*.015,'face');gl.finish();gpu.push(performance.now()-start);}const percentile=(x,p)=>x.slice().sort((a,b)=>a-b)[Math.floor((x.length-1)*p)];return{mode,triangles:r.triangleCount,synchronizedDrawMedianMs:percentile(gpu,.5),synchronizedDraw95Ms:percentile(gpu,.95),samples:24,method:'CPU submission plus gl.finish; not an interactive FPS estimate'};}
async function run(){if(busy)return;busy=true;document.querySelector('#run').disabled=true;try{r?.dispose();views.replaceChildren();report.checks=[];report.views=[];report.errors=[];if(software){const get=source.getContext.bind(source);source.getContext=(type,...args)=>type==='webgl2'?null:get(type,...args)}r=await createHumanRenderer(source);check(r.info.mode===(software?'software':'webgl'),r.info.mode+' / '+r.info.gpu);for(const[color,hairColor]of [['Brown',defaults.hairColor],['Blond','#d4b477'],['Black','#191614']])for(const[angle,yaw]of [['Front',0],['Three-quarter',.65],['Profile',Math.PI/2]])for(const mode of ['baseline','groom'])await view(color+' '+angle,{...defaults,hairColor},yaw,mode);
const special=[['Back',{},Math.PI],['Opposite side',{},-1.1],['Wide / long',{headWidth:1,headHeight:1,build:1,shoulders:1,smile:.7},.65],['Narrow / short',{headWidth:0,headHeight:0,build:0,shoulders:0,browFurrow:.6},-.65],['All face maxima',Object.fromEntries(Object.keys(r.info.morphs).map(k=>[k,1])),Math.PI/2],['Blond rim',{hairColor:'#d4b477'},.65]];for(const[label,delta,yaw]of special)await view(label,{...defaults,...delta},yaw,'groom',label==='Blond rim'?'rim':'studio');
check(report.errors.length===0,'No renderer/shader console errors');check(r.info.boneCount===53,'Original 53-bone rig');r.setHairPreview('groom');r.update(defaults);const cropTriangles=r.triangleCount;r.update({...defaults,hair:'none'});const baldTriangles=r.triangleCount;r.update(defaults);check(r.triangleCount===cropTriangles&&baldTriangles<cropTriangles,'Repeated crop / bald / crop visibility');report.renderer={...r.info};report.triangles={crop:cropTriangles,bald:baldTriangles};if(!software)report.timing=[await timing('baseline'),await timing('groom')];report.passed=true;if(params.has('capture')){report.capture=await capture(software?'hair-software.png':'hair-comparison.png',await new Promise(resolve=>mosaic(0,18).toBlob(resolve)));if(!software){await capture('hair-closeup.png',await new Promise(resolve=>mosaic(2,2,2,1).toBlob(resolve)));await capture('hair-extremes.png',await new Promise(resolve=>mosaic(18,6,3).toBlob(resolve)));}await capture(software?'hair-software-report.json':'hair-report.json',new Blob([JSON.stringify(report,null,2)]));}document.querySelector('#export').disabled=false;out.textContent+='\nREADY FOR VISUAL REVIEW';if(params.has('exports'))await exports();}catch(e){report.passed=false;out.textContent+='\nFAIL '+e.stack}finally{busy=false;document.querySelector('#run').disabled=false}}
async function exports(){try{report.exports=[];for(const[name,mode,delta]of [['hair-baseline','baseline',{}],['hair-neutral','groom',{}],['hair-extreme','groom',{headWidth:1,headHeight:1,smile:.7,browRaise:.4,blinkLeft:.6,gazeHorizontal:.4,lowerGarment:'skirt',pose:'stride',hairColor:'#d4b477'}],['hair-bald','groom',{hair:'none',pose:'wave'}]]){r.setHairPreview(mode);const project={...defaults,...delta};r.update(project);r.render(.65,'face');const start=performance.now(),data=await r.exportGLB(name);const g=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true))));const groomNode=g.nodes.find(n=>n.name==='HairGroom'),groom=groomNode&&g.meshes[groomNode.mesh];if(name==='hair-bald')check(!g.nodes.some(m=>/Hair/.test(m.name)),'Bald export omits every hair mesh');else if(mode==='groom'){check(!!groom&&!g.nodes.some(m=>m.name==='HairStrands'),'Only new groom exported');check(groom.extras.targetNames.includes('HeadWide'),'Editable groom identity targets');check(!!g.materials.find(m=>m.name==='HairGroom')?.extensions?.KHR_materials_anisotropy,'Portable directional highlight extension');}check(g.animations.length===4,'Four pose clips / '+name);report.exports.push({project,mode,exportMilliseconds:performance.now()-start,capture:await capture(name+'.glb',data,'export')});}report.exportPassed=true;await capture('hair-export-report.json',new Blob([JSON.stringify(report,null,2)]));out.textContent+='\nEXPORTS COMPLETE';}catch(e){report.exportPassed=false;out.textContent+='\nFAIL '+e.stack}}
document.querySelector('#run').onclick=run;document.querySelector('#export').onclick=exports;if(params.has('auto'))run();
</script></html>
