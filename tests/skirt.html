<!doctype html><html lang="en"><meta charset="utf-8"><title>Original skirt rig acceptance</title><style>body{font:15px system-ui;background:#eee;color:#263b35;margin:24px}button{padding:12px}pre{white-space:pre-wrap}#views{display:grid;grid-template-columns:repeat(3,320px);gap:14px}figure{margin:0}canvas{width:320px;height:430px;display:block;background:#e8e8e4}figcaption{padding:6px}</style><h1>Original skirt rig acceptance</h1><p>Local HTTP browser tests. Original procedural garment, auxiliary bones, no cloth simulation.</p><button id="run">Run skirt checks</button> <button id="export" disabled>Verify exports</button><pre id="results">Ready</pre><div id="views"></div><script type="module">
import * as T from '../vendor/three.module.min.js';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';import {defaults} from '../src/project.js';import {createHumanRenderer} from '../src/human-renderer.js';
const params=new URLSearchParams(location.search),software=params.has('software');
const result=document.querySelector('#results');let renders=[],busy=false;const lines=[],report={checks:[],views:[],exports:[]};
function check(ok,label){lines.push((ok?'PASS ':'FAIL ')+label);report.checks.push({label,passed:!!ok});result.textContent=lines.join('\n');if(!ok)throw Error(label);}
async function run(){if(busy)return;busy=true;document.querySelector('#run').disabled=true;try{for(const {r} of renders)r.dispose();renders=[];lines.length=0;report.checks.length=0;report.views.length=0;report.exports.length=0;delete report.exportPassed;document.querySelector('#views').replaceChildren();document.querySelector('#export').disabled=true;report.startedAt=new Date().toISOString();const {createSkirtRig,skirtPoseRotations}=await import('../src/skirt-rig.js');const g=await new GLTFLoader().loadAsync('../assets/human/foundation.glb'),human=g.scene;let bones=[];human.traverse(o=>{if(o.isBone)bones.push(o)});const original=bones.map(b=>[b.name,b.position.toArray(),b.quaternion.toArray(),b.scale.toArray(),b.parent.name]);const skirt=createSkirtRig({human,pants:human.getObjectByName('Pants'),shirt:human.getObjectByName('Outfit'),pelvis:human.getObjectByName('pelvis')});check(bones.length===53&&JSON.stringify(original)===JSON.stringify(bones.map(b=>[b.name,b.position.toArray(),b.quaternion.toArray(),b.scale.toArray(),b.parent.name])),'All 53 original body bones and rest transforms preserved');check(skirt.bones.length===9&&skirt.root.parent.name==='pelvis','Nine separate auxiliary bones anchored to pelvis');const geo=skirt.mesh.geometry,w=geo.attributes.skinWeight,i=geo.attributes.skinIndex;check(w.count>500&&w.count===geo.attributes.uv.count,'Skirt topology and UV coordinates present');let valid=true,maxInfluences=0;for(let v=0;v<w.count;v++){let sum=0,count=0;for(let k=0;k<4;k++){const weight=w.array[4*v+k];sum+=weight;count+=weight>0;valid&&=Number.isFinite(weight)&&weight>=0&&i.array[4*v+k]>=0&&i.array[4*v+k]<9;}valid&&=Math.abs(sum-1)<1e-6;maxInfluences=Math.max(maxInfluences,count);}check(valid&&maxInfluences<=3,'Normalized garment-only skin weights, maximum three influences');skirt.update({...defaults,lowerGarment:'trousers'});check(!skirt.root.visible&&!skirt.mesh.visible&&human.getObjectByName('Pants').visible,'Trousers omit optional skirt and auxiliary bones');skirt.update({...defaults,lowerGarment:'skirt'});check(skirt.root.visible&&skirt.mesh.visible&&!human.getObjectByName('Pants').visible,'Skirt replaces trousers without removing the body');human.updateMatrixWorld(true);skirt.mesh.skeleton.update();const points=Array.from({length:w.count},(_,v)=>skirt.mesh.getVertexPosition(v,new T.Vector3()));human.getObjectByName('lowerarm_l').rotation.x+=.6;human.updateMatrixWorld(true);skirt.mesh.skeleton.update();check(points.every((p,v)=>p.distanceTo(skirt.mesh.getVertexPosition(v,new T.Vector3()))<1e-7),'Arm edits cannot pull skirt vertices');skirt.update({...defaults,lowerGarment:'skirt',skirtSwing:.12});human.updateMatrixWorld(true);skirt.mesh.skeleton.update();check(points.some((p,v)=>p.distanceTo(skirt.mesh.getVertexPosition(v,new T.Vector3()))>.005),'Hem sway edits actual auxiliary bones');check(Object.keys(skirt.mesh.morphTargetDictionary).join(',')==='BuildNarrow,BuildBroad','Editable narrow and broad fit morphs');for(const name of ['relaxed','tpose','wave','stride']){const clip=new T.AnimationClip(name,1,[]);check(skirt.extendClips([clip],.1)[0].tracks.length===8&&!clip.tracks.length,'Auxiliary pose tracks: '+name);}check(JSON.stringify(skirtPoseRotations('stride',0))!==JSON.stringify(skirtPoseRotations('relaxed',0)),'Stride has authored secondary-bone posing');
const {checkSkirtFit}=await import('./skirt-fit.js');report.fit=checkSkirtFit(g,skirt);check(report.fit.passed,'60 pose/build/sway combinations, '+report.fit.samples+' samples: body '+(1000*report.fit.bodyClearance).toFixed(2)+' mm, waist '+(1000*report.fit.waistClearance).toFixed(2)+' mm clearance');const fixtureTextures=new Set();g.scene.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const material of Array.isArray(o.material)?o.material:[o.material]){for(const value of Object.values(material))if(value?.isTexture)fixtureTextures.add(value);material.dispose();}}});fixtureTextures.forEach(t=>t.dispose());
const cases=[['Neutral front',{},0],['Neutral back',{},Math.PI],['Stride front',{pose:'stride'},0],['Stride back',{pose:'stride'},Math.PI],['Narrow + sway',{build:0,shoulders:0,height:.9,skirtSwing:-.12,pose:'wave'},.45],['Broad + sway',{build:1,shoulders:1,height:1.1,skirtSwing:.12,pose:'tpose'},Math.PI+.3]];for(const[label,delta,yaw]of cases){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=label;figure.append(canvas,caption);document.querySelector('#views').append(figure);if(software){const original=canvas.getContext.bind(canvas);canvas.getContext=(type,...args)=>type==='webgl2'?null:original(type,...args);}
const r=await createHumanRenderer(canvas);const project={...defaults,lowerGarment:'skirt',...delta};r.update(project);r.render(yaw,'body');renders.push({r,canvas,project,label});report.views.push({label,project,renderer:{...r.info}});check(r.info.boneCount===53,'Body bone count retained: '+label);}document.querySelector('#export').disabled=false;report.passed=true;report.finishedAt=new Date().toISOString();result.textContent=lines.join('\n')+'\nREADY FOR VISUAL REVIEW · '+renders[0].r.info.mode+' · '+renders[0].r.info.gpu;if(params.has('capture'))await captures();}catch(e){report.passed=false;result.textContent+='\nFAIL '+e.message;}finally{busy=false;document.querySelector('#run').disabled=false;}}

async function capture(name,body){const r=await fetch('/__qa/capture/'+name,{method:'POST',body});if(!r.ok)throw Error('Capture HTTP '+r.status);return r.json();}
async function captures(){const c=document.createElement('canvas');c.width=960;c.height=970;const ctx=c.getContext('2d');ctx.fillStyle='#e8e8e4';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#263b35';ctx.font='bold 22px system-ui';ctx.fillText('Persona Forge · Original auxiliary skirt rig',18,30);ctx.font='13px system-ui';ctx.fillText(renders[0].r.info.mode+' · '+renders[0].r.info.gpu+' · localhost',18,55);for(let i=0;i<renders.length;i++){const x=i%3*320,y=Math.floor(i/3)*450+65;ctx.drawImage(renders[i].canvas,x,y,320,430);ctx.fillText(renders[i].label,x+12,y+447);}report.comparison=await capture(software?'skirt-software.png':'skirt-comparison.png',await new Promise(r=>c.toBlob(r)));await capture(software?'skirt-software-report.json':'skirt-report.json',new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));}
async function exports(){if(busy)return;busy=true;document.querySelector('#run').disabled=true;try{document.querySelector('#export').disabled=true;for(const [file,delta]of [['skirt-neutral',{}],['skirt-stride',{build:1,shoulders:1,height:1.1,skirtSwing:.12,pose:'stride'}],['skirt-trousers',{lowerGarment:'trousers'}]]){const r=renders[0].r,project={...defaults,lowerGarment:'skirt',...delta};r.update(project);r.render(0,'body');const data=await r.exportGLB(file),g=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true)))),jointIds=new Set(g.skins.flatMap(s=>s.joints)),joints=[...jointIds].map(i=>g.nodes[i].name),isSkirt=project.lowerGarment==='skirt';check(joints.length===(isSkirt?62:53),'Export joint count '+file+': '+joints.length);check(g.nodes.some(n=>n.name==='Skirt')===isSkirt,'Optional skirt mesh '+file);check(g.nodes.some(n=>n.name==='Pants')!==isSkirt,'Selected lower garment '+file);check(g.animations.length===4,'Four clips '+file);check(g.images.every(i=>i.bufferView!==undefined),'Embedded textures '+file);const response=await fetch('/__qa/export/'+file+'.glb',{method:'POST',body:data});if(!response.ok)throw Error('Export capture HTTP '+response.status);report.exports.push({project,capture:await response.json(),renderer:{...r.info}});}report.namingCases=[];for(const name of ['Skirt','skirt_panel_01']){const r=renders[0].r;r.update({...defaults,lowerGarment:'skirt'});const data=await r.exportGLB(name),g=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true)))),root=g.scenes[g.scene||0].nodes[0];check(g.animations.every(a=>a.channels.every(c=>c.target.node!==root)),'Colliding character name keeps all animation on children: '+name);check(g.animations.every(a=>a.channels.filter(c=>c.target.path==='weights').every(c=>g.nodes[c.target.node].mesh!==undefined)),'Morph tracks target meshes: '+name);report.namingCases.push({name,passed:true,bytes:data.byteLength});}report.exportPassed=true;report.exportFinishedAt=new Date().toISOString();await capture(software?'skirt-software-report.json':'skirt-report.json',new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));result.textContent=lines.join('\n')+'\nEXPORTS PASSED AND CAPTURED';}catch(e){result.textContent+='\nFAIL '+e.stack;}finally{busy=false;document.querySelector('#run').disabled=false;document.querySelector('#export').disabled=false;}}
document.querySelector('#export').onclick=exports;document.querySelector('#run').onclick=run;
if(new URLSearchParams(location.search).has('auto'))run();
</script></html>
