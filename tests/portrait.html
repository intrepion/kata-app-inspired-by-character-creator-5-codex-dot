<!doctype html><html lang="en"><meta charset="utf-8"><title>Portrait acceptance</title><style>body{font:15px system-ui;margin:24px;background:#eee;color:#24352e}button,a{padding:8px;margin:4px}#views{display:flex;flex-wrap:wrap;gap:16px}figure{margin:0}canvas{display:block;width:360px;height:440px;background:#e8e8e4}pre{white-space:pre-wrap}</style><h1>Portrait acceptance</h1><p>Actual renderer and exporter, served over localhost. Hardware verification requires WebGL mode with a real GPU, not software emulation.</p><button id="run">Compare portraits</button><button id="export" disabled>Export extreme portrait</button><a id="download" hidden>Download exact tested GLB</a><pre id="results">Ready</pre><div id="views"></div><script type="module">
import {createHumanRenderer} from '../src/human-renderer.js';import {defaults,parseProject} from '../src/project.js';
const result=document.querySelector('#results'),views=document.querySelector('#views');let renders=[];let exportRenderer;
const cases=[['Front crop',{},0],['Three-quarter',{},.55],['Side',{},Math.PI/2],['Bald',{hair:'none'},0],['Small face',{jaw:0,nose:0,eyes:0,skin:'#e0b492',eyeColor:'#527c96'},.25],['Broad face',{jaw:1,nose:1,eyes:1,skin:'#805339',eyeColor:'#6b7347'},-.25]];
document.querySelector('#run').onclick=async()=>{try{for(const r of renders)r.dispose();renders=[];views.replaceChildren();const lines=[];for(const [label,delta,yaw]of cases){const figure=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=label;figure.append(c,caption);views.append(figure);const r=await createHumanRenderer(c);r.update({...defaults,...delta});r.render(yaw,'face');renders.push(r);lines.push(label+': '+r.info.mode+' · '+r.info.gpu);result.textContent=lines.join('\n');}exportRenderer=renders.at(-1);document.querySelector('#export').disabled=false;const old={...defaults};delete old.eyeColor;lines.push('Old v2 eye color default: '+parseProject(JSON.stringify(old)).project.eyeColor);result.textContent=lines.join('\n');}catch(e){result.textContent+='\nFAIL '+e.stack;}};
document.querySelector('#export').onclick=async()=>{try{const data=await exportRenderer.exportGLB('Portrait extreme');const json=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true))));const test=(ok,label)=>{result.textContent+='\n'+(ok?'PASS ':'FAIL ')+label;if(!ok)throw Error(label)};test(json.materials.some(m=>m.name==='Skin'&&m.normalTexture&&m.pbrMetallicRoughness.metallicRoughnessTexture),'normal and roughness embedded');test(json.materials.some(m=>m.name==='Iris'),'separate iris tint');test(json.nodes.some(n=>n.name==='HairStrands'),'textured short hair retained');test(json.meshes.some(m=>m.extras?.targetNames?.includes('EyesLarge')),'editable face shapes');test(json.images.every(i=>i.bufferView!==undefined),'all images embedded');const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));a.download='persona-portrait-extreme.glb';a.hidden=false;result.textContent+='\nExport bytes: '+data.byteLength;if(new URLSearchParams(location.search).has('capture')){const r=await fetch('/__qa/export/portrait-extreme.glb',{method:'POST',body:data});if(!r.ok)throw Error('QA capture HTTP '+r.status);result.textContent+='\nCaptured exact browser GLB: '+JSON.stringify(await r.json());}}catch(e){result.textContent+='\nFAIL '+e.stack;}};
</script></html>
