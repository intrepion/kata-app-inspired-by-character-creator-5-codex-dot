<!doctype html><html lang="en"><meta charset="utf-8"><title>Human export verification</title><style>body{font:15px system-ui;background:#f3f1ea;color:#263730;margin:24px}canvas{width:440px;height:650px;display:block}button,a{margin:8px;padding:8px}pre{white-space:pre-wrap}</style><h1>Human export verification</h1><p>Local HTTP test of the same renderer/exporter used in the app. Checks actual GLB data, not a mock.</p><button id="run">Run export checks</button><a id="download" hidden>Download tested GLB</a><pre id="results">Ready</pre><canvas id="stage"></canvas><script type="module">
import {createHumanRenderer} from '../src/human-renderer.js';
import {defaults} from '../src/project.js';
const results=document.querySelector('#results'),button=document.querySelector('#run'),canvas=document.querySelector('canvas');
const lines=[];function check(value,text){lines.push((value?'PASS ':'FAIL ')+text);results.textContent=lines.join('\n');if(!value)throw Error(text);}
function json(buffer){const view=new DataView(buffer);if(view.getUint32(0,true)!==0x46546c67)throw Error('Not a GLB');const length=view.getUint32(12,true);return JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,20,length)));}
button.onclick=async()=>{button.disabled=true;try{check(location.protocol.startsWith('http'),'HTTP origin');const renderer=await createHumanRenderer(canvas);renderer.update(defaults);renderer.render(0,'body');const baseline=json(await renderer.exportGLB('Baseline'));
const project={...defaults,name:'Blender roundtrip',build:.75,shoulders:.65,jaw:.7,nose:.35,eyes:.65,height:1.06,hair:'none',pose:'wave'};renderer.update(project);renderer.render(.32,'body');const data=await renderer.exportGLB(project.name),gltf=json(data);
check(gltf.asset.version==='2.0','glTF 2.0 binary');check(gltf.skins?.some(skin=>skin.joints.length>=20),'Weighted rig with at least 20 joints');check(gltf.meshes.every(mesh=>mesh.primitives.every(p=>p.attributes.TEXCOORD_0!==undefined)),'Every mesh retains UV coordinates');check(gltf.meshes.some(mesh=>mesh.primitives.some(p=>p.attributes.JOINTS_0!==undefined&&p.attributes.WEIGHTS_0!==undefined)),'Joint indices and skin weights exported');check(gltf.meshes.some(mesh=>mesh.primitives.some(p=>p.targets?.length>=10)),'Ten editable face/body morph targets');check(gltf.meshes.some(mesh=>mesh.weights?.some(weight=>weight>0)),'Current non-neutral morph values retained');check(gltf.images?.length>=2&&gltf.images.every(image=>image.bufferView!==undefined),'Skin and eye images embedded in GLB');check(['relaxed','tpose','wave','stride'].every(name=>gltf.animations.some(clip=>clip.name===name)),'Four bone-driven poses exported');check(gltf.animations[0].name==='wave','Selected pose is first for Blender auto-play');const baseBones=new Map(baseline.nodes.filter(node=>node.rotation).map(node=>[node.name,node.rotation]));check(gltf.nodes.some(node=>baseBones.has(node.name)&&JSON.stringify(node.rotation)!==JSON.stringify(baseBones.get(node.name))),'Current wave pose differs from relaxed bone transforms');check(!gltf.nodes.some(node=>node.name==='HairCrop'),'Hidden hair omitted');check(gltf.nodes.some(node=>node.scale?.every(value=>Math.abs(value-1.06)<.0001)),'Current height scale retained');
const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob([data],{type:'model/gltf-binary'}));a.download='persona-blender-roundtrip.glb';a.hidden=false;lines.push('DONE: '+data.byteLength.toLocaleString()+' bytes; import this exact GLB in Blender.');results.textContent=lines.join('\n');if(new URLSearchParams(location.search).has('capture')){const r=await fetch('/__qa/export/bald-wave.glb',{method:'POST',body:data});if(!r.ok)throw Error('QA capture HTTP '+r.status);results.textContent+='\nCaptured exact browser GLB: '+JSON.stringify(await r.json());}}catch(error){results.textContent+='\nERROR '+error.message;}finally{button.disabled=false;}};
</script></html>
