<!doctype html><html lang="en"><meta charset="utf-8"><title>Blink and gaze acceptance</title><style>body{font:15px system-ui;background:#eee;color:#263b35;margin:20px}button{padding:12px}pre{white-space:pre-wrap}#views{display:grid;grid-template-columns:repeat(3,440px);gap:12px}figure{margin:0}canvas{width:440px;height:560px;display:block;background:#e8e8e4}figcaption{padding:6px}#source{position:fixed;left:-1000px;top:0;width:440px;height:560px}</style><h1>Blink and gaze acceptance</h1><p>Original editable eye controls. Localhost, front / three-quarter / profile. Left and right refer to the character.</p><button id="run">Run checks</button> <button id="export" disabled>Export blink and gaze</button><pre id="results">Ready</pre><canvas id="source"></canvas><div id="views"></div><script type="module">
import {defaults,presets} from '../src/project.js';import {createHumanRenderer} from '../src/human-renderer.js';
const params=new URLSearchParams(location.search),software=params.has('software'),mode=params.get('mode')||'basic',result=document.querySelector('#results'),source=document.querySelector('#source'),report={mode,checks:[],views:[],exports:[]};let r,busy=false;
function check(ok,label){report.checks.push({passed:!!ok,label});result.textContent=report.checks.map(x=>(x.passed?'PASS ':'FAIL ')+x.label).join('\n');if(!ok)throw Error(label);}
async function capture(name,body,kind='capture'){const response=await fetch('/__qa/'+kind+'/'+name,{method:'POST',body});if(!response.ok)throw Error('Capture '+response.status);return response.json();}
const cases=mode==='presets'?Object.entries(presets).filter(([k])=>['angular','rounded','long'].includes(k)).flatMap(([key,p])=>[[key+' closed front',{...p,hair:'none',blinkLeft:1,blinkRight:1},0],[key+' wink + up',{...p,hair:'none',blinkLeft:1,gazeHorizontal:1,gazeVertical:1},.65],[key+' gaze profile',{...p,hair:'none',gazeHorizontal:-1,gazeVertical:-1},Math.PI/2]]):mode==='extremes'?[
['Minimum identity closed',{headWidth:0,headHeight:0,eyes:0,eyeSpacing:0,browHeight:0,cheeks:0,blinkLeft:1,blinkRight:1},0],['Maximum identity closed',{headWidth:1,headHeight:1,eyes:1,eyeSpacing:1,browHeight:1,cheeks:1,blinkLeft:1,blinkRight:1},0],['Mixed identity wink',{headWidth:0,headHeight:1,eyes:1,eyeSpacing:0,browHeight:1,blinkLeft:1,gazeHorizontal:1,gazeVertical:1},.65],['Broad crop, gaze down',{headWidth:1,headHeight:0,eyes:0,eyeSpacing:1,browHeight:0,hair:'crop',gazeHorizontal:-1,gazeVertical:-1},.65],['Skirt stride, blink',{lowerGarment:'skirt',pose:'stride',build:1,shoulders:1,blinkRight:1,gazeHorizontal:-1},0,'body'],['Trousers wave, gaze',{pose:'wave',height:.9,build:0,shoulders:0,gazeHorizontal:1,gazeVertical:1},Math.PI,'body']]:[
['Neutral front',{},0],['Closed front',{blinkLeft:1,blinkRight:1},0],['Left wink',{blinkLeft:1},0],['Half blink',{blinkLeft:.5,blinkRight:.5},.65],['Closed three-quarter',{blinkLeft:1,blinkRight:1},.65],['Closed profile',{blinkLeft:1,blinkRight:1},Math.PI/2],['Gaze right and up',{gazeHorizontal:1,gazeVertical:1},0],['Gaze left and down',{gazeHorizontal:-1,gazeVertical:-1},0],['Wink with gaze',{blinkRight:1,gazeHorizontal:-1,gazeVertical:1},.65]];
async function run(){if(busy)return;busy=true;document.querySelector('#run').disabled=true;try{r?.dispose();report.checks=[];report.views=[];document.querySelector('#views').replaceChildren();if(software){const get=source.getContext.bind(source);source.getContext=(type,...args)=>type==='webgl2'?null:get(type,...args);}r=await createHumanRenderer(source);check(r.info.mode===(software?'software':'webgl'),'Renderer '+r.info.mode+' / '+r.info.gpu);for(const[label,delta,yaw,focus]of cases){const p={...defaults,hair:'none',...delta};r.update(p);r.render(yaw,focus||'face');const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=source.width;canvas.height=source.height;canvas.getContext('2d').drawImage(source,0,0);caption.textContent=label;figure.append(canvas,caption);document.querySelector('#views').append(figure);report.views.push({label,project:p,yaw,focus:focus||'face'});check(r.info.boneCount===53,label+' retains body rig');await new Promise(requestAnimationFrame);}report.renderer={...r.info};report.passed=true;document.querySelector('#export').disabled=false;result.textContent+='\nREADY FOR VISUAL REVIEW';if(params.has('capture')){const mosaic=document.createElement('canvas');mosaic.width=1320;mosaic.height=Math.ceil(cases.length/3)*590+50;const c=mosaic.getContext('2d');c.fillStyle='#e8e8e4';c.fillRect(0,0,mosaic.width,mosaic.height);c.fillStyle='#263b35';c.font='20px system-ui';c.fillText('Blink / gaze · '+mode+' · '+r.info.mode+' · '+r.info.gpu,16,30);const tiles=document.querySelectorAll('#views canvas');tiles.forEach((canvas,i)=>{const x=i%3*440,y=Math.floor(i/3)*590+50;c.drawImage(canvas,x,y,440,560);c.font='15px system-ui';c.fillText(cases[i][0],x+8,y+580);});report.capture=await capture('blink-'+(software?'software':mode)+'.png',await new Promise(resolve=>mosaic.toBlob(resolve)));await capture('blink-'+(software?'software':mode)+'-report.json',new Blob([JSON.stringify(report,null,2)]));}}catch(e){result.textContent+='\nFAIL '+e.stack;report.passed=false;}finally{busy=false;document.querySelector('#run').disabled=false;}}
async function exports(){if(busy)return;busy=true;try{for(const[name,delta]of [['blink-neutral',{}],['blink-closed',{...presets.rounded,blinkLeft:1,blinkRight:1}],['blink-gaze',{...presets.angular,blinkLeft:.72,blinkRight:.15,gazeHorizontal:1,gazeVertical:-1,lowerGarment:'skirt',pose:'stride',skirtSwing:.1}]]){const p={...defaults,...delta};r.update(p);r.render(0,'face');const data=await r.exportGLB(name),g=JSON.parse(new TextDecoder().decode(new Uint8Array(data,20,new DataView(data).getUint32(12,true))));check(g.animations.length===4,'Four retained poses in '+name);for(const meshName of ['HumanBody','Eyes','Iris','Cornea','Lashes']){const node=g.nodes.find(n=>n.name===meshName),mesh=g.meshes[node.mesh];check(['BlinkLeft','BlinkRight','GazeLeft','GazeRight','GazeUp','GazeDown'].every(x=>mesh.extras.targetNames.includes(x)),'Editable eye targets '+meshName+' / '+name);}report.exports.push({project:p,capture:await capture(name+'.glb',data,'export')});}report.exportPassed=true;await capture('blink-export-report.json',new Blob([JSON.stringify(report,null,2)]));result.textContent+='\nEXPORTS VERIFIED';}catch(e){result.textContent+='\nFAIL '+e.stack;}finally{busy=false;}}
document.querySelector('#run').onclick=run;document.querySelector('#export').onclick=exports;if(params.has('auto'))run();
</script></html>
