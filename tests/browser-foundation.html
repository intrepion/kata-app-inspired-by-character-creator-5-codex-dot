<!doctype html><html lang="en"><meta charset="utf-8"><title>Human foundation browser checks</title><style>body{font:15px system-ui}iframe{width:1100px;height:850px;border:1px solid #ddd}pre{white-space:pre-wrap}</style><h1>Human foundation browser checks</h1><p>Serve this repository over HTTP and visit this page on localhost. No file URLs.</p><pre id="results">Running…</pre><iframe title="Persona Forge test application" id="app"></iframe><script type="module">
import {defaults,migrate} from '../src/project.js';
const output=document.querySelector('#results'),frame=document.querySelector('#app'),results=[];
function check(value,label){results.push((value?'PASS ':'FAIL ')+label);output.textContent=results.join('\n');if(!value)throw Error(label);}
const sleep=t=>new Promise(r=>setTimeout(r,t));
try{check(location.protocol.startsWith('http'),'HTTP testing only');const old={version:1,name:'Legacy Test',height:1.2,shoulders:1,torso:1,head:1,arms:1,legs:1,skin:'#ba805e',outfit:'#d97842',pants:'#3b5550',hairColor:'#313c34',hair:'bob',pose:'relaxed',yaw:.32};localStorage.removeItem('kata-persona-v2-qa');localStorage.setItem('kata-persona-v1-qa',JSON.stringify(old));frame.src=new URL(location).searchParams.has('software')?'../artifacts/qa-software-app.html?qa':'../?qa';await new Promise(r=>frame.onload=r);const doc=frame.contentDocument;for(let n=0;n<120&&doc.querySelector('#export').disabled;n++)await sleep(250);check(!doc.querySelector('#export').disabled,'Human asset ready and GLB export enabled');check(doc.querySelector('#load-state').hidden,'Loading state clears');check(doc.querySelector('#legacy-notice').textContent.includes('approximately'),'Migration notice visible');check(JSON.parse(localStorage.getItem('kata-persona-v1-qa')).hair==='bob','Old autosave is preserved');check(JSON.parse(localStorage.getItem('kata-persona-v2-qa')).hair==='crop','New autosave converts unsupported style');check(doc.querySelectorAll('#sliders input').length===15,'Fifteen body and face controls');const build=doc.querySelector('#build');build.value='.7';build.dispatchEvent(new Event('input',{bubbles:true}));build.dispatchEvent(new Event('change',{bubbles:true}));doc.querySelector('#undo').click();check(build.value==='.5'||build.value==='0.5','Undo restores control');doc.querySelector('#redo').click();check(Number(build.value)===.7,'Redo restores edit');doc.querySelector('[data-pose="wave"]').click();check(doc.querySelector('[data-pose="wave"]').getAttribute('aria-pressed')==='true','Pose selection accessible');doc.querySelector('#focus-face').click();check(doc.querySelector('#focus-face').getAttribute('aria-pressed')==='true','Face focus accessible');check(doc.querySelector('#mesh-count').textContent.includes('TRIANGLES'),'Real mesh count shown');const win=frame.contentWindow;async function importFile(value){const transfer=new win.DataTransfer();transfer.items.add(new win.File([typeof value==='string'?value:JSON.stringify(value)],'test.persona',{type:'application/json'}));doc.querySelector('#file').files=transfer.files;doc.querySelector('#file').dispatchEvent(new win.Event('change',{bubbles:true}));await sleep(150);}win.confirm=()=>false;await importFile({...defaults,name:'Cancelled'});check(doc.querySelector('#name').value==='Legacy Test','Cancel import keeps current character');win.confirm=()=>true;await importFile({...defaults,name:'Imported Human'});check(doc.querySelector('#name').value==='Imported Human','Actual project file import works');check(doc.querySelector('#legacy-notice').hidden,'Native v2 project clears legacy notice');doc.querySelector('#undo').click();check(doc.querySelector('#name').value==='Legacy Test','Import remains undoable');await importFile({...defaults,version:99});check(doc.querySelector('#status').textContent.includes('newer version'),'Future version rejected visibly');check(doc.querySelector('#name').value==='Legacy Test','Failed import preserves current project');await importFile('x'.repeat(100001));check(doc.querySelector('#status').textContent.includes('100 KB'),'Oversized file rejected visibly');frame.style.width='375px';await sleep(300);check(doc.documentElement.scrollWidth<=375,'Mobile has no horizontal overflow');results.push('DONE');output.textContent=results.join('\n');}catch(error){results.push('ERROR '+error.message);output.textContent=results.join('\n');}
</script></html>
